apiVersion: v1
kind: ConfigMap
metadata:
  name: signoz-otel-config
  namespace: all-in-one
data:
  otel-collector-config.yaml: |
    receivers:
      otlp/spanmetrics:
        protocols:
          grpc:
            endpoint: localhost:12345
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        send_batch_size: 10000
        send_batch_max_size: 11000
        timeout: 10s
      memory_limiter:
        check_interval: 5s
        limit_mib: 512
      signozspanmetrics/prometheus:
        metrics_exporter: prometheus
        latency_histogram_buckets: [100us, 1ms, 2ms, 6ms, 10ms, 50ms, 100ms, 250ms, 500ms, 1000ms, 1400ms, 2000ms, 5s, 10s, 20s, 40s, 60s]
        dimensions_cache_size: 100000
        dimensions:
          - name: service.namespace
            default: default
          - name: deployment.environment
            default: default
    exporters:
      clickhousetraces:
        datasource: tcp://signoz-clickhouse:9000/?username=default&password=signoz&database=signoz_traces
      signozclickhousemetrics:
        dsn: tcp://signoz-clickhouse:9000/?username=default&password=signoz&database=signoz_metrics
      clickhouselogsexporter:
        dsn: tcp://signoz-clickhouse:9000/?username=default&password=signoz&database=signoz_traces
        timeout: 5s
        sending_queue:
          queue_size: 100
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      prometheus:
        endpoint: 0.0.0.0:8889
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [signozspanmetrics/prometheus, memory_limiter, batch]
          exporters: [clickhousetraces]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [signozclickhousemetrics]
        metrics/spanmetrics:
          receivers: [otlp/spanmetrics]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouselogsexporter]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-init
  namespace: all-in-one
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS signoz_traces;
    CREATE DATABASE IF NOT EXISTS signoz_metrics;
---
apiVersion: v1
kind: Service
metadata:
  name: signoz-clickhouse
  namespace: all-in-one
  labels:
    app: signoz
    component: clickhouse
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
      name: tcp
    - port: 8123
      targetPort: 8123
      protocol: TCP
      name: http
  selector:
    app: signoz
    component: clickhouse
---
apiVersion: v1
kind: Service
metadata:
  name: signoz-otel-collector
  namespace: all-in-one
  labels:
    app: signoz
    component: otel-collector
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 4317
      targetPort: 4317
    - name: http
      port: 4318
      targetPort: 4318
  selector:
    app: signoz
    component: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: signoz-query-service
  namespace: all-in-one
  labels:
    app: signoz
    component: query-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: signoz
    component: query-service
---
apiVersion: v1
kind: Service
metadata:
  name: signoz-frontend
  namespace: all-in-one
  labels:
    app: signoz
    component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 3301
      targetPort: 3301
      protocol: TCP
      name: http
  selector:
    app: signoz
    component: frontend
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: signoz-clickhouse-pvc
  namespace: all-in-one
  labels:
    app: signoz
    component: clickhouse
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # storageClassName usa o default do cluster
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-users-config
  namespace: all-in-one
data:
  json_type.xml: |
    <clickhouse>
      <profiles>
        <default>
          <allow_experimental_json_type>1</allow_experimental_json_type>
        </default>
      </profiles>
    </clickhouse>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-cluster-config
  namespace: all-in-one
data:
  cluster.xml: |
    <clickhouse>
      <keeper_server>
        <tcp_port>9181</tcp_port>
        <server_id>1</server_id>
        <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>
        <coordination_settings>
          <operation_timeout_ms>10000</operation_timeout_ms>
          <session_timeout_ms>30000</session_timeout_ms>
        </coordination_settings>
        <raft_configuration>
          <server>
            <id>1</id>
            <hostname>127.0.0.1</hostname>
            <port>9444</port>
          </server>
        </raft_configuration>
      </keeper_server>
      <remote_servers>
        <cluster>
          <shard>
            <replica>
              <host>127.0.0.1</host>
              <port>9000</port>
            </replica>
          </shard>
        </cluster>
      </remote_servers>
    </clickhouse>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signoz-clickhouse
  namespace: all-in-one
  labels:
    app: signoz
    component: clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signoz
      component: clickhouse
  template:
    metadata:
      labels:
        app: signoz
        component: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_PASSWORD
              value: "signoz"
          ports:
            - containerPort: 9000
              name: tcp
            - containerPort: 8123
              name: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: clickhouse-init
              mountPath: /docker-entrypoint-initdb.d
            - name: clickhouse-cluster-config
              mountPath: /etc/clickhouse-server/config.d/cluster.xml
              subPath: cluster.xml
            - name: clickhouse-users-config
              mountPath: /etc/clickhouse-server/users.d/json_type.xml
              subPath: json_type.xml
          # resources:
          #   requests:
          #     cpu: 500m
          #     memory: 1Gi
          #   limits:
          #     cpu: 2000m
          #     memory: 4Gi
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: signoz-clickhouse-pvc
        - name: clickhouse-init
          configMap:
            name: clickhouse-init
        - name: clickhouse-cluster-config
          configMap:
            name: clickhouse-cluster-config
        - name: clickhouse-users-config
          configMap:
            name: clickhouse-users-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signoz-otel-collector
  namespace: all-in-one
  labels:
    app: signoz
    component: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signoz
      component: otel-collector
  template:
    metadata:
      labels:
        app: signoz
        component: otel-collector
    spec:
      initContainers:
        - name: wait-for-clickhouse
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for ClickHouse..."
              for i in $(seq 1 30); do
                if wget -qO- http://signoz-clickhouse:8123/ping 2>/dev/null | grep -q Ok; then
                  echo "ClickHouse is ready!"
                  exit 0
                fi
                echo "Waiting... ($i/30)"
                sleep 2
              done
              echo "ClickHouse not ready after 30 attempts"
              exit 1
      containers:
        - name: otel-collector
          image: signoz/signoz-otel-collector:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otel/config.yaml
          ports:
            - containerPort: 4317
              name: grpc
            - containerPort: 4318
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          # resources:
          #   requests:
          #     cpu: 100m
          #     memory: 256Mi
          #   limits:
          #     cpu: 500m
          #     memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 4317
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 4317
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          configMap:
            name: signoz-otel-config
            items:
              - key: otel-collector-config.yaml
                path: config.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: signoz-frontend-nginx
  namespace: all-in-one
data:
  default.conf: |
    server {
      listen       3301;
      server_name  _;

      gzip on;
      gzip_static on;
      gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript;
      gzip_proxied  any;
      gzip_vary on;
      gzip_comp_level 6;
      gzip_buffers 16 8k;
      gzip_http_version 1.1;

      client_max_body_size 24M;
      large_client_header_buffers 8 128k;

      location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
      }

      location /api/ {
        proxy_pass http://signoz-query-service:8080/api/;
      }

      error_page   500 502 503 504  /50x.html;
      location = /50x.html {
        root   /usr/share/nginx/html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signoz-query-service
  namespace: all-in-one
  labels:
    app: signoz
    component: query-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signoz
      component: query-service
  template:
    metadata:
      labels:
        app: signoz
        component: query-service
    spec:
      initContainers:
        - name: wait-for-clickhouse
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for ClickHouse..."
              for i in $(seq 1 30); do
                if wget -qO- http://signoz-clickhouse:8123/ping 2>/dev/null | grep -q Ok; then
                  echo "ClickHouse is ready!"
                  exit 0
                fi
                echo "Waiting... ($i/30)"
                sleep 2
              done
              echo "ClickHouse not ready after 30 attempts"
              exit 1
      containers:
        - name: query-service
          image: signoz/query-service:0.34.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ClickHouseUrl
              value: "tcp://signoz-clickhouse:9000?username=default&password=signoz"
            - name: STORAGE
              value: "clickhouse"
            - name: SIGNOZ_DB_PATH
              value: "/var/lib/signoz/signoz.db"
          volumeMounts:
            - name: sqlite-data
              mountPath: /var/lib/signoz
          # resources:
          #   requests:
          #     cpu: 100m
          #     memory: 256Mi
          #   limits:
          #     cpu: 500m
          #     memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/v1/version
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/version
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/version
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: sqlite-data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signoz-frontend
  namespace: all-in-one
  labels:
    app: signoz
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signoz
      component: frontend
  template:
    metadata:
      labels:
        app: signoz
        component: frontend
    spec:
      containers:
        - name: frontend
          image: signoz/frontend:0.34.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3301
              name: http
          env:
            - name: FRONTEND_API_ENDPOINT
              value: ""
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          # resources:
          #   requests:
          #     cpu: 100m
          #     memory: 128Mi
          #   limits:
          #     cpu: 500m
          #     memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3301
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3301
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: signoz-frontend-nginx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signoz-ingress
  namespace: all-in-one
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: ${INGRESS_ENTRYPOINT}
spec:
  rules:
    - host: signoz.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: signoz-frontend
                port:
                  number: 3301

apiVersion: v1
kind: ConfigMap
metadata:
  name: signoz-otel-config
  namespace: all-in-one
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        send_batch_size: 1000
        timeout: 10s
      memory_limiter:
        check_interval: 5s
        limit_mib: 512
    exporters:
      clickhouse/traces:
        endpoint: tcp://signoz-clickhouse:9000
        database: signoz_traces
        ttl: 7
      clickhouse/metrics:
        endpoint: tcp://signoz-clickhouse:9000
        database: signoz_metrics
        ttl: 30
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse/traces]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse/metrics]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse/traces]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-init
  namespace: all-in-one
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS signoz_traces;
    CREATE DATABASE IF NOT EXISTS signoz_metrics;
    CREATE TABLE IF NOT EXISTS signoz_traces.distributed_top_level_operations (
      name LowCardinality(String),
      serviceName LowCardinality(String)
    ) ENGINE = ReplacingMergeTree
    ORDER BY (serviceName, name);
---
apiVersion: v1
kind: Service
metadata:
  name: signoz-clickhouse
  namespace: all-in-one
  labels:
    app: signoz
    component: clickhouse
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
      name: tcp
    - port: 8123
      targetPort: 8123
      protocol: TCP
      name: http
  selector:
    app: signoz
    component: clickhouse
---
apiVersion: v1
kind: Service
metadata:
  name: signoz-otel-collector
  namespace: all-in-one
  labels:
    app: signoz
    component: otel-collector
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 4317
      targetPort: 4317
    - name: http
      port: 4318
      targetPort: 4318
  selector:
    app: signoz
    component: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: signoz-query-service
  namespace: all-in-one
  labels:
    app: signoz
    component: query-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: signoz
    component: query-service
---
apiVersion: v1
kind: Service
metadata:
  name: signoz-frontend
  namespace: all-in-one
  labels:
    app: signoz
    component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 3301
      targetPort: 3301
      protocol: TCP
      name: http
  selector:
    app: signoz
    component: frontend
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: signoz-clickhouse-pvc
  namespace: all-in-one
  labels:
    app: signoz
    component: clickhouse
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # storageClassName usa o default do cluster
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signoz-clickhouse
  namespace: all-in-one
  labels:
    app: signoz
    component: clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signoz
      component: clickhouse
  template:
    metadata:
      labels:
        app: signoz
        component: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:23.8-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: tcp
            - containerPort: 8123
              name: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: clickhouse-init
              mountPath: /docker-entrypoint-initdb.d
          # resources:
          #   requests:
          #     cpu: 500m
          #     memory: 1Gi
          #   limits:
          #     cpu: 2000m
          #     memory: 4Gi
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: signoz-clickhouse-pvc
        - name: clickhouse-init
          configMap:
            name: clickhouse-init
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signoz-otel-collector
  namespace: all-in-one
  labels:
    app: signoz
    component: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signoz
      component: otel-collector
  template:
    metadata:
      labels:
        app: signoz
        component: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.91.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otel/config.yaml
          ports:
            - containerPort: 4317
              name: grpc
            - containerPort: 4318
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          # resources:
          #   requests:
          #     cpu: 100m
          #     memory: 256Mi
          #   limits:
          #     cpu: 500m
          #     memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 4317
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 4317
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          configMap:
            name:   signoz-otel-config
            items:
              - key: otel-collector-config.yaml
                path: config.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: signoz-frontend-nginx
  namespace: all-in-one
data:
  default.conf: |
    server {
      listen       3301;
      server_name  _;

      gzip on;
      gzip_static on;
      gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript;
      gzip_proxied  any;
      gzip_vary on;
      gzip_comp_level 6;
      gzip_buffers 16 8k;
      gzip_http_version 1.1;

      client_max_body_size 24M;
      large_client_header_buffers 8 128k;

      location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
      }

      location /api/ {
        proxy_pass http://signoz-query-service:8080/api/;
      }

      error_page   500 502 503 504  /50x.html;
      location = /50x.html {
        root   /usr/share/nginx/html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signoz-query-service
  namespace: all-in-one
  labels:
    app: signoz
    component: query-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signoz
      component: query-service
  template:
    metadata:
      labels:
        app: signoz
        component: query-service
    spec:
      containers:
        - name: query-service
          image: signoz/query-service:0.34.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ClickHouseUrl
              value: "tcp://signoz-clickhouse:9000"
            - name: STORAGE
              value: "clickhouse"
            - name: SIGNOZ_DB_PATH
              value: "/var/lib/signoz/signoz.db"
          volumeMounts:
            - name: sqlite-data
              mountPath: /var/lib/signoz
          # resources:
          #   requests:
          #     cpu: 100m
          #     memory: 256Mi
          #   limits:
          #     cpu: 500m
          #     memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/v1/version
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/version
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/version
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: sqlite-data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signoz-frontend
  namespace: all-in-one
  labels:
    app: signoz
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signoz
      component: frontend
  template:
    metadata:
      labels:
        app: signoz
        component: frontend
    spec:
      containers:
        - name: frontend
          image: signoz/frontend:0.34.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3301
              name: http
          env:
            - name: FRONTEND_API_ENDPOINT
              value: ""
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          # resources:
          #   requests:
          #     cpu: 100m
          #     memory: 128Mi
          #   limits:
          #     cpu: 500m
          #     memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3301
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3301
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: signoz-frontend-nginx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signoz-ingress
  namespace: all-in-one
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: ${INGRESS_ENTRYPOINT}
spec:
  rules:
    - host: signoz.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: signoz-frontend
                port:
                  number: 3301

apiVersion: v1
kind: Service
metadata:
  name: redisinsight
  namespace: all-in-one
  labels:
    app: redisinsight
    component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 5540
      targetPort: 5540
      protocol: TCP
      name: http
  selector:
    app: redisinsight
    component: frontend
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redisinsight-pvc
  namespace: all-in-one
  labels:
    app: redisinsight
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
  namespace: all-in-one
  labels:
    app: redisinsight
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redisinsight
      component: frontend
  template:
    metadata:
      labels:
        app: redisinsight
        component: frontend
    spec:
      containers:
        - name: redisinsight
          image: ${REDISINSIGHT_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5540
              name: http
          volumeMounts:
            - name: redisinsight-data
              mountPath: /data
          # resources:
          #   requests:
          #     cpu: 100m
          #     memory: 256Mi
          #   limits:
          #     cpu: 500m
          #     memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 5540
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 5540
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: redisinsight-data
          persistentVolumeClaim:
            claimName: redisinsight-pvc
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redisinsight-ingress
  namespace: all-in-one
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: ${INGRESS_ENTRYPOINT}
spec:
  rules:
    - host: redisinsight.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redisinsight
                port:
                  number: 5540

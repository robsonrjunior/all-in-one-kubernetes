apiVersion: v1
kind: Service
metadata:
  name: n8n-master
  namespace: all-in-one
  labels:
    app: n8n
    component: master
spec:
  type: ClusterIP
  ports:
    - port: 5678
      targetPort: 5678
      protocol: TCP
      name: http
    - port: 5679
      targetPort: 5679
      protocol: TCP
      name: task-broker
  selector:
    app: n8n
    component: master
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-master-pvc
  namespace: all-in-one
  labels:
    app: n8n
    component: master
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  # storageClassName usa o default do cluster
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-master
  namespace: all-in-one
  labels:
    app: n8n
    component: master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
      component: master
  template:
    metadata:
      labels:
        app: n8n
        component: master
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
      containers:
        - name: n8n-master
          image: ${N8N_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5678
              name: http
            - containerPort: 5679
              name: task-broker
          env:
            - name: N8N_HOST
              valueFrom:
                configMapKeyRef:
                  name: n8n-config
                  key: N8N_HOST
            - name: N8N_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: n8n-config
                  key: N8N_PROTOCOL
            - name: N8N_PORT
              valueFrom:
                configMapKeyRef:
                  name: n8n-config
                  key: N8N_PORT
            - name: N8N_SECURE_COOKIE
              valueFrom:
                configMapKeyRef:
                  name: n8n-config
                  key: N8N_SECURE_COOKIE
            - name: DB_TYPE
              valueFrom:
                configMapKeyRef:
                  name: n8n-config
                  key: DB_TYPE
            - name: DB_POSTGRESDB_HOST
              valueFrom:
                configMapKeyRef:
                  name: n8n-config
                  key: DB_POSTGRESDB_HOST
            - name: DB_POSTGRESDB_PORT
              valueFrom:
                configMapKeyRef:
                  name: n8n-config
                  key: DB_POSTGRESDB_PORT
            - name: DB_POSTGRESDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: n8n-config
                  key: DB_POSTGRESDB_DATABASE
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: DB_POSTGRESDB_USER
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: DB_POSTGRESDB_PASSWORD
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: N8N_ENCRYPTION_KEY
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: n8n-config
                  key: NODE_ENV
            - name: N8N_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: n8n-config
                  key: N8N_LOG_LEVEL
            - name: N8N_RUNNERS_MODE
              valueFrom:
                configMapKeyRef:
                  name: n8n-config
                  key: N8N_RUNNERS_MODE
            - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: n8n-config
                  key: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: N8N_RUNNERS_AUTH_TOKEN
            - name: EXECUTIONS_MODE
              value: "queue"
            - name: QUEUE_BULL_REDIS_HOST
              value: "redis.all-in-one.svc.cluster.local"
            - name: QUEUE_BULL_REDIS_PORT
              value: "6379"
            - name: QUEUE_BULL_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          envFrom:
            - configMapRef:
                name: n8n-otel-config
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
          # resources:
          #   requests:
          #     cpu: 200m
          #     memory: 256Mi
          #   limits:
          #     cpu: 1000m
          #     memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-master-pvc
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-ingress
  namespace: all-in-one
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: ${INGRESS_ENTRYPOINT}
spec:
  rules:
    - host: n8n.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n-master
                port:
                  number: 5678

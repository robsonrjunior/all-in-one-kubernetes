apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-otel-config
  namespace: all-in-one
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://signoz-otel-collector.all-in-one.svc.cluster.local:4317"
  OTEL_SERVICE_NAME: "n8n"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=all-in-one,deployment.environment=production"

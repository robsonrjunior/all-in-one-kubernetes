apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-runner
  namespace: all-in-one
  labels:
    app: n8n
    component: runner
spec:
  replicas: 4
  selector:
    matchLabels:
      app: n8n
      component: runner
  template:
    metadata:
      labels:
        app: n8n
        component: runner
    spec:
      initContainers:
        - name: wait-for-postgres
          image: ${BUSYBOX_IMAGE}
          command:
            - /bin/sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
        - name: wait-for-n8n-master
          image: ${BUSYBOX_IMAGE}
          command:
            - /bin/sh
            - -c
            - |
              until wget -qO- http://n8n-master:5678/healthz > /dev/null 2>&1; do
                echo "Waiting for n8n-master to finish migrations..."
                sleep 3
              done
              echo "n8n-master is ready!"
      containers:
        - name: n8n-runner
          image: ${N8N_RUNNERS_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: N8N_RUNNERS_TASK_BROKER_URI
              valueFrom:
                configMapKeyRef:
                  name: n8n-config
                  key: N8N_RUNNERS_TASK_BROKER_URI
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: N8N_RUNNERS_AUTH_TOKEN
          # resources:
          #   requests:
          #     cpu: 100m
          #     memory: 128Mi
          #   limits:
          #     cpu: 500m
          #     memory: 512Mi

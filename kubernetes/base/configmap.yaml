apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-config
  namespace: all-in-one
data:
  TZ: "America/Sao_Paulo"
  DOMAIN: "${DOMAIN}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-config
  namespace: all-in-one
data:
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_DATABASE: "n8n"
  DB_POSTGRESDB_HOST: "postgres.all-in-one.svc.cluster.local"
  DB_POSTGRESDB_PORT: "5432"
  N8N_HOST: "${N8N_HOST}"
  N8N_PROTOCOL: "${N8N_PROTOCOL}"
  N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE}
  N8N_PORT: "5678"
  NODE_ENV: "production"
  N8N_LOG_LEVEL: "info"
  N8N_RUNNERS_MODE: "external"
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: "0.0.0.0"
  N8N_RUNNERS_TASK_BROKER_URI: "http://n8n-master:5679"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: all-in-one
data:
  init.sql: |
    CREATE DATABASE n8n;
    CREATE USER n8n_user WITH PASSWORD '${N8N_DB_PASSWORD}';
    GRANT ALL PRIVILEGES ON DATABASE n8n TO n8n_user;
    \c n8n
    CREATE EXTENSION IF NOT EXISTS vector;
    GRANT ALL ON SCHEMA public TO n8n_user;


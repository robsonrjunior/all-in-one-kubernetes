schema: spec-driven

context: |
  ## Tech Stack
  - Kubernetes manifests (YAML) com Kustomize para gerenciamento de 3 ambientes
  - n8n (latest) como plataforma de automação, rodando em modo fila (queue mode) com master + workers + runners
  - PostgreSQL 16 com extensão pgvector (pgvector/pgvector:pg16)
  - Redis 7 (redis:7-alpine) como message broker para o Bull queue do n8n
  - RabbitMQ (rabbitmq:3-management) como message broker auxiliar
  - MinIO (minio/minio:latest) como object storage compatível com S3 para armazenamento de arquivos do n8n
  - SigNoz como stack de observabilidade (ClickHouse, OTel Collector, Query Service, Frontend)
  - OpenTelemetry para tracing distribuído
  - Traefik como Ingress Controller (via annotations traefik.ingress.kubernetes.io)
  - Busybox 1.36 para init containers de wait-for e init-db
  - Scripts de geração: Bash com envsubst para substituição de variáveis

  ## Arquitetura
  - Projeto Kustomize com estrutura base/ + overlays/{dev,homolog,prod}/
  - Base define todos os recursos (namespace, secrets, configmaps, deployments, statefulsets, services, PVCs, ingress)
  - Overlays aplicam patches específicos por ambiente: hosts de ingress, resource limits/requests, replicas
  - Manifestos gerados são escritos em kubernetes/generated/<env>.yaml (gitignored)
  - Script generate.sh faz o build Kustomize + envsubst para substituir ${VAR} do .env

  ## Domain Knowledge
  - Namespace único: all-in-one
  - DEPLOY_ENV define qual overlay usar (dev, homolog, prod)
  - DOMAIN define o domínio base, N8N_HOST define o subdomínio do n8n
  - TLS_ENABLED deriva N8N_PROTOCOL (http/https) e INGRESS_ENTRYPOINT (web/websecure)
  - Ambientes: dev (Minikube, nip.io, sem TLS, resources baixos), homolog (k3s, cert-manager staging), prod (k3s/cloud, cert-manager production, HA)
  - PostgreSQL roda como StatefulSet com volumeClaimTemplate (único stateful, os demais são Deployment)
  - Workers e Runners têm init containers duplos: wait-for-postgres + wait-for-n8n-master
  - Postgres tem init container que copia init.sql (cria bancos n8n/signoz, usuários, extensão vector) para docker-entrypoint-initdb.d
  - n8n usa queue mode: master recebe requisições HTTP, workers/runners processam jobs via Redis Bull queue

  ## Convenções
  - Todos os recursos no namespace all-in-one
  - Labels: app=<service>, component=<subcomponent> (ex: app: n8n, component: worker)
  - Services: ClusterIP, com portas nomeadas
  - PVC naming: <service>-pvc, com accessMode ReadWriteOnce
  - ConfigMap naming: <service>-config (n8n-config, signoz-config, postgres-init)
  - Secret naming: <service>-secret (postgres-secret, redis-secret, minio-secret, n8n-secret)
  - Probes em todos os deployments: livenessProbe + readinessProbe (HTTP /healthz ou exec)
  - Resources são comentados no base e aplicados via patches nos overlays
  - Ingress do tipo host-based routing (um Ingress por serviço: n8n-ingress, minio-ingress, signoz-ingress, rabbitmq-ingress)
  - Makefile como entrypoint de operações (deploy, teardown, validate, logs, port-forward)
  - Senhas e secrets no .env são templates ${VAR} que o generate.sh expande
  - RabbitMQ-secret está ausente (RabbitMQ usa variáveis de ambiente diretas no deployment)

  ## Regras de modificação
  - NUNCA comitar o arquivo .env (está no .gitignore)
  - NUNCA comitar arquivos em kubernetes/generated/ (está no .gitignore)
  - Sempre que adicionar um novo serviço: criar manifest em kubernetes/base/<categoria>/<servico>.yaml, adicionar ao resources do base/kustomization.yaml
  - Sempre que adicionar um novo Ingress: adicionar patch de host nos 3 overlays
  - Variáveis sensíveis devem ir para Secrets, não ConfigMaps
  - Usar envsubst (${VAR}) nos manifests base e overlays que precisam de valores do .env
  - Seguir o padrão de init containers existente para dependências
  - Manter os 3 overlays (dev/homolog/prod) em sincronia quando adicionar patches
  - Documentar no README.md qualquer novo serviço, porta, ou comando

  ## Idiomas
  - Comentários e mensagens em português brasileiro
  - Nomes técnicos (labels, service names, config keys) em inglês

rules:
  proposal:
    - Manter propostas concisas (máximo 1 página)
    - Sempre mencionar impacto nos 3 ambientes (dev, homolog, prod)
    - Listar quais arquivos Kubernetes serão criados ou modificados
  tasks:
    - Quebrar tarefas em unidades de no máximo 1 hora
    - Ordenar tasks por dependência (infra antes de app)
    - Incluir task de validação (`make validate`) ao final
  design:
    - Sempre incluir diagrama ASCII da arquitetura afetada
    - Documentar decisões de resource sizing por ambiente
    - Especificar variáveis de ambiente novas e suas defaults no .env.example
